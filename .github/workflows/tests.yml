name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    # The window guards only run on Windows. GitHub's windows-latest runner does have a
    # desktop session: the test that spawns a real #32770 dialog passes here, it does not
    # skip. The summary step below prints the counts so that stays checkable.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -v -rs --junitxml=report.xml
      - name: Report what actually ran
        # A green check does not say whether a test ran or skipped. The dialog tests
        # need a desktop session, so the run page states the counts out loud.
        if: always()
        run: python .github/ci_summary.py report.xml >> $env:GITHUB_STEP_SUMMARY

  cross-platform:
    # failloud.fs must keep working with no dependencies and no Windows.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -v tests/test_fs.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

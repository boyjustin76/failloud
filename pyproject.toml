[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "failloud"
version = "0.1.0"
description = "Make silent failures loud: guards for desktop automation and file I/O on Windows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "boyjustin76" }]
keywords = [
    "windows",
    "automation",
    "gui-automation",
    "win32",
    "screenshot",
    "printwindow",
    "modal-dialog",
    "filesystem",
    "reliability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# Window capture renders to a PIL image. The filesystem guards need nothing.
capture = ["pillow>=9"]
dev = ["pillow>=9", "pytest>=7", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/boyjustin76/failloud"
Issues = "https://github.com/boyjustin76/failloud/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/failloud"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
